# Machine-wide settings for software development with agents.
# Copy only what you need to ~/.config/coop/coop.toml.

[tools]
packages = ["shellcheck"]

# Give new Coops your shared agent instructions without overwriting changes
# already made inside an existing Coop.
[[seed]]
src = "~/.agents/AGENTS.md"
policy = "if-absent"

# Read a GitHub credential through the host's configured Git credential helper.
# See docs/credentials.md for setup and rotation.
[credentials.github-example]
source = { type = "git-credential", url = "https://github.com/example" }
expose = [
  { type = "git-credential-store" },
  { type = "environment", name = "GH_TOKEN", field = "password" },
]

# Only projects under this path receive the credential.
[[projects]]
match = "~/Projects/example"
include_credentials = ["github-example"]
