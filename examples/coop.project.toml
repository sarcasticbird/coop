# Machine-local settings for this checkout.
# Copy to <project-root>/.coop.toml and keep it Git-ignored.

[resources]
cpus = 6
memory = "12G"

[tools]
packages = ["go-task", "nodejs_22"]

# Keep Linux-generated dependencies out of a macOS checkout.
# [[volume]]
# path = "web/node_modules"

# Publish a guest service on host loopback. The guest service must listen on
# 0.0.0.0, not only localhost.
# [[publish]]
# guest_port = 5173
# host_port = 5173
